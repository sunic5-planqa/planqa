name: Keep backend awake

on:
  schedule:
    # Render's free tier sleeps a service after ~15 min of no traffic; ping well under that.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: curl -fsS --max-time 60 https://sunnic-backend.onrender.com/healthz
