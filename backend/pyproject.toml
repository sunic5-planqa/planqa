[project]
name = "sunnic-backend"
version = "0.1.0"
description = "써니C backend — Confluence 사이드패널 기획서 QA 검증 백엔드"
authors = [
    { name = "kayo2e", email = "gy3216@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "google-genai>=2.16.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Vendored as-is from sunic5-planqa/planqa-agent (feature/review-agent) — keep it a diffable
# copy of upstream rather than reshaping it to satisfy rules upstream doesn't enforce.
"src/sunnic_backend/qa_engine/review_agent/**" = ["B023", "C408", "UP047", "I001"]
